# Tests on every push and pull request.
#
# `pages.yml` also runs the suite, but only on `main` and only as a gate on deploying —
# by then a bad change is already merged. This is the one that runs on a pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not paranoia: this tool reads paths out of `definition.pbir` and
        # walks folder names, and most people author PBIP on Windows. A separator bug
        # would pass every Linux run and break the primary platform.
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

  # The suite passes inside the monorepo, where every import resolves from the hoisted
  # root `node_modules`. That is not what a user gets. This installs the tarballs into an
  # empty directory and runs the CLI there — the only check that would have caught
  # `esbuild` being a devDependency while the handoff command imported it at runtime.
  packaged:
    name: Install the tarballs like a user
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pack every published package
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          for pkg in core viewer handoff export cli; do
            npm pack "./packages/$pkg" --pack-destination "$RUNNER_TEMP/tarballs"
          done

      - name: Install them into an empty project
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p consumer && cd consumer
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/tarballs/*.tgz

      - name: Run the CLI the way a user would
        working-directory: ${{ runner.temp }}/consumer
        run: |
          npx pbi-lineage-lenz check   "$GITHUB_WORKSPACE/samples/contoso"
          npx pbi-lineage-lenz handoff "$GITHUB_WORKSPACE/samples/contoso" -o handoff.html
          npx pbi-lineage-lenz docs    "$GITHUB_WORKSPACE/samples/contoso" --format md -o MODEL.md
          test -s handoff.html
          test -s MODEL.md

  # The sample is committed so contributors can reproduce results. It came from a real
  # Fabric workspace, so a sanitisation slip would publish a hostname or a workspace GUID.
  # Cheap to check, expensive to miss.
  no-leaks:
    name: No internal names anywhere
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The token list is the lesson from the first run of this job, which found the
      # BigQuery project id in two test files and then stopped looking. A leak is not one
      # string: it is a vocabulary — table names, key-naming conventions, business terms.
      # Add to this list rather than excluding a file from it. The only two exclusions are
      # this file and the test that asserts the same thing, both of which have to name the
      # tokens in order to look for them.
      - name: Grep the tree
        run: |
          if grep -rIil --exclude-dir=.git \
               -e 'ingka' -e 'ilo-ia-prod' -e 'sample_powerbi' -e '77oajh3' -e 'fauoi4qi' \
               -e 'oversell' -e 'business_unit' -e 'report_fulfilment' -e 'HFB' \
               -e 'Pia Link' -e '_isk' -e '_ifk' \
               -e 'wait time' -e 'switch_over' -e 'cut off time' . \
             | grep -v -e '^./.github/workflows/ci.yml$' \
                       -e '^./packages/core/tests/bundledSample.test.js$'; then
            echo "::error::An internal name reached the tree. See the matches above."
            exit 1
          fi
