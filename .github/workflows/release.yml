name: Publish to PyPI

# The final model-lenz release: a deprecation notice pointing at PBI Lineage Lenz.
#
# ⚠️ BEFORE PUSHING THE TAG — update the PyPI Trusted Publisher.
#
# It was configured against the repository name `pbip_model_lenz`, and this repository
# has since been renamed to `pbi-lineage-lenz`. PyPI matches the OIDC claim on the
# repository name, so the publish will be rejected until it is updated:
#
#   https://pypi.org/manage/project/model-lenz/settings/publishing/
#     Owner:              JonathanJihwanKim
#     Repository name:    pbi-lineage-lenz      <- was pbip_model_lenz
#     Workflow filename:  release.yml
#     Environment name:   pypi
#
# The `pypi` environment has a required reviewer, so the run pauses for approval
# before anything is uploaded.

on:
  push:
    tags:
      - "v0.5.*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install hatch

      - run: hatch build

      # The package has exactly one behaviour, so this asserts exactly that: the notice
      # names its replacement, and the command fails rather than quietly succeeding.
      # `model-lenz check` was a build gate; a deprecated release that exited 0 would
      # leave a gate that always passes standing where a real check used to be.
      - name: Verify the wheel does the one thing it should
        run: |
          python -m venv check_env
          ./check_env/bin/pip install --quiet dist/model_lenz-*.whl
          ./check_env/bin/model-lenz 2> notice.txt && { echo "::error::exited 0"; exit 1; }
          grep -q "npx pbi-lineage-lenz" notice.txt || { echo "::error::no replacement named"; exit 1; }
          grep -q "model-lenz==0.4.0" notice.txt || { echo "::error::no pin for the old release"; exit 1; }
          cat notice.txt

      # No runtime dependencies is the point — the working release pulled in fastapi,
      # uvicorn, pydantic, networkx and typer.
      - name: Verify it installs nothing else
        run: |
          installed=$(./check_env/bin/pip list --format=freeze --exclude-editable \
            | grep -Ev '^(pip|setuptools|wheel)==' || true)
          echo "installed: $installed"
          test "$installed" = "model-lenz==0.5.1"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/model-lenz
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/model-lenz
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

# There is deliberately no GitHub release job here. The old one used
# softprops/action-gh-release, which marks what it creates as the *latest* release by
# default — so tagging this deprecation stub would have quietly demoted PBI Lineage Lenz
# 1.0.0 on the repository front page in favour of a package that does nothing.
