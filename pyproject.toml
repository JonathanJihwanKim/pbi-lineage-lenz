[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-lenz"
version = "0.5.1"
description = "DEPRECATED — replaced by PBI Lineage Lenz. Use `npx pbi-lineage-lenz` instead. Pin model-lenz==0.4.0 for the last working release."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jihwan Kim" }]
keywords = ["deprecated", "powerbi", "pbip", "tmdl", "dax", "fabric", "lineage"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

# No dependencies. The working release pulled in fastapi, uvicorn, pydantic,
# networkx and typer; a package whose only job is to print a notice has no business
# installing a web server into somebody's environment.
dependencies = []

[project.scripts]
model-lenz = "model_lenz.cli:main"

[project.urls]
Homepage = "https://github.com/JonathanJihwanKim/pbi-lineage-lenz"
Repository = "https://github.com/JonathanJihwanKim/pbi-lineage-lenz"
Issues = "https://github.com/JonathanJihwanKim/pbi-lineage-lenz/issues"
"Replaced by" = "https://www.npmjs.com/package/pbi-lineage-lenz"
"Last working release" = "https://pypi.org/project/model-lenz/0.4.0/"

[tool.hatch.build.targets.wheel]
packages = ["src/model_lenz"]
